<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchoolHub - School Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234c5fd5'/%3E%3Cpath d='M18 40l32-14 32 14-32 14z' fill='white'/%3E%3Cpath d='M32 52v14c0 5 8 9 18 9s18-4 18-9V52l-18 8z' fill='%23d9d2ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-name">SchoolHub</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">Demo project. Please don't store real student data.</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"></button>
      <div class="topbar-title">
        <h1 id="page-title">Dashboard</h1>
        <span id="today-label"></span>
      </div>
      <div class="topbar-user">
        <div class="user-text"><strong>School Admin</strong><span>Demo account</span></div>
        <div class="avatar">SA</div>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
